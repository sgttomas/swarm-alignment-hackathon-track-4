name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - name: Run local and CI checks
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CHECK_BASE" ] || [[ "$CHECK_BASE" =~ ^0+$ ]]; then
            CHECK_BASE=$(git hash-object -t tree /dev/null)
          fi
          uv run --python 3.13 tools/checks.py --base "$CHECK_BASE"
