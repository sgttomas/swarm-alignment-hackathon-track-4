# Consumer-local input/use conditions; no satisfaction or research-readiness state is asserted.
id: DEL-01-01
name: Research basis and bounded case definitions
needs:
- from: external:owner
  condition: Ryan supplies actual research steering that clears the post-setup hold and identifies the
    selected undertaking, discretion, resources and return. Approval of the source documents or initialized
    files alone does not clear that hold.
  when: Before any research production under this deliverable.
  gating: true
  evidence: docs/WORKED_CASE.md#owners-disposition-and-approved-use
- from: doc:docs/HACKATHON_SOURCE_BASIS.md
  condition: The Overview, Resources, Guidelines and Schedule supply identified context, candidate leads,
    event constraints and timing. Recheck the affected primary source when current wording or availability
    matters; site examples and access headers are not novelty or data-fitness evidence.
  when: When framing candidates, selecting source leads or planning against event requirements.
  gating: false
  evidence: docs/RESEARCH_DECOMP.md#1-purpose-basis-and-scope-standing
- from: external:primary-research-authors
  condition: The six General and eight Track 4 organizer primary readings, in the recorded versions and
    coverage, must inform framing, candidate choice and evaluation conditions alongside the retained
    case-specific primary work for the broad Track 4 slate, covering research sabotage, approval composition,
    reviewer assignment, test recognition, monitor memory, capability auditing, communication controls,
    and incident attribution, together with the current hybrid's research-audit and source-code contracts.
    Preserve historical source limits and distinguish source statements,
    theoretical/empirical standing and actual
    examination from previews, citations, reproduction or broad novelty claims. Access/version/appendix
    limits remain explicit; new cases still need their own closest-work and evidence qualification.
  when: Before making a case-specific prior-work, novelty, inference or feasibility claim.
  gating: false
  evidence: execution/PKG-01/DEL-01-01/Work/hybrid-formation/PROPOSAL.md#2-what-is-grounded-what-is-new-and-what-is-not
- from: DEL-02-01
  condition: A bounded preliminary access/coverage/sample qualification supports the candidate observation
    need, with actual source, permitted use, identity/time semantics, gaps and feasibility limits. A whole
    evidence platform or complete support deliverable is not required.
  when: When recommending a candidate whose inference depends on retained, source, host or state observations.
  gating: false
  evidence: docs/RESEARCH_DECOMP.md#4-inputuse-relationships-and-integration
- from: DEL-02-01
  condition: A material evidence-source or transformation finding identifies what changed and which framing/inference
    conditions it undermines, so the affected candidate basis can be reconsidered.
  when: When qualification or later consumption exposes a consequential source, coverage or observation
    defect.
  gating: false
  evidence: docs/RESEARCH_DECOMP.md#4-inputuse-relationships-and-integration
- from: DEL-02-02
  condition: A named analytical or execution feasibility probe returns its identified inputs, method,
    actual result and limits sufficient to settle the candidate uncertainty. New trial generation or a
    general runtime is not presumed.
  when: Only when an existing operation or small probe is needed to judge a serious candidate.
  gating: false
  evidence: docs/RESEARCH_DECOMP.md#4-inputuse-relationships-and-integration
- from: DEL-01-02
  condition: Investigation findings identify the contrary evidence, failed premise, changed criterion
    or unresolved explanation that warrants revising a case definition, preserving the earlier basis.
  when: When a selected case materially changes the research question, interpretation or method.
  gating: false
  evidence: docs/RESEARCH_DECOMP.md#4-inputuse-relationships-and-integration
- from: DEL-03-01
  condition: A synthesis critique identifies a specific unsupported added inference, incompatible condition
    or lost qualification and the needed response from the case-definition owner.
  when: When integration reveals a material defect in the framing or prior-work account.
  gating: false
  evidence: docs/RESEARCH_DECOMP.md#4-inputuse-relationships-and-integration
